<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phone AI Check</title>
<style>
:root{--bg:#05070d;--fg:#e9e4d8;--mut:#9a948a;--ok:#7fd18b;--warn:#f0c060;--bad:#ff7a6a;--card:#10141f;--line:#262c3a}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,sans-serif;padding:16px;max-width:640px;margin:auto}
h1{font-size:20px;margin:4px 0 2px;color:#ffb38a}p{color:var(--mut);margin:4px 0 14px}
button{font:inherit;background:#ffb38a;color:#1a0f08;border:0;border-radius:10px;padding:12px 18px;font-weight:600;width:100%;margin:6px 0}
button.sec{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.row b{font-weight:500}.row span{text-align:right;color:var(--mut)}
.ok{color:var(--ok)!important}.warn{color:var(--warn)!important}.bad{color:var(--bad)!important}
#verdict{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0;font-size:17px}
</style></head><body>
<h1>Can this phone run the conversation model?</h1>
<p>Open this page in Chrome on the phone, tap Check, and wait about 20 seconds. Nothing is downloaded or sent anywhere.</p>
<button id="go">Check this phone</button>
<div id="verdict" hidden></div>
<div id="out"></div>
<button id="copy" class="sec" hidden>Copy results</button>
<script>
const out=document.getElementById('out'),R=[];
function row(k,v,c){R.push(k+': '+v);const d=document.createElement('div');d.className='row';d.innerHTML='<b></b><span></span>';d.firstChild.textContent=k;d.lastChild.textContent=v;if(c)d.lastChild.className=c;out.appendChild(d);}
async function bench(dev){
  const N=512,code=`@group(0)@binding(0)var<storage,read>a:array<f32>;@group(0)@binding(1)var<storage,read>b:array<f32>;@group(0)@binding(2)var<storage,read_write>c:array<f32>;
  @compute @workgroup_size(8,8)fn main(@builtin(global_invocation_id)g:vec3<u32>){let n=${N}u;if(g.x>=n||g.y>=n){return;}var s=0.0;for(var k=0u;k<n;k++){s+=a[g.y*n+k]*b[k*n+g.x];}c[g.y*n+g.x]=s;}`;
  const sz=N*N*4,mk=u=>dev.createBuffer({size:sz,usage:u}),S=GPUBufferUsage.STORAGE;
  const A=mk(S|GPUBufferUsage.COPY_DST),B=mk(S|GPUBufferUsage.COPY_DST),C=mk(S);
  const f=new Float32Array(N*N).map(()=>Math.random());dev.queue.writeBuffer(A,0,f);dev.queue.writeBuffer(B,0,f);
  const p=dev.createComputePipeline({layout:'auto',compute:{module:dev.createShaderModule({code}),entryPoint:'main'}});
  const bg=dev.createBindGroup({layout:p.getBindGroupLayout(0),entries:[A,B,C].map((buffer,i)=>({binding:i,resource:{buffer}}))});
  const run=n=>{const e=dev.createCommandEncoder();for(let i=0;i<n;i++){const q=e.beginComputePass();q.setPipeline(p);q.setBindGroup(0,bg);q.dispatchWorkgroups(N/8,N/8);q.end();}dev.queue.submit([e.finish()]);return dev.queue.onSubmittedWorkDone();};
  await run(2);const t0=performance.now();await run(20);const dt=(performance.now()-t0)/1000;return 2*N*N*N*20/dt/1e9;}
document.getElementById('go').onclick=async()=>{
  out.innerHTML='';R.length=0;const V=document.getElementById('verdict');V.hidden=false;V.textContent='Checking…';let score=0,fatal='';
  const ua=navigator.userAgent,cv=(ua.match(/Chrome\/(\d+)/)||[])[1];
  row('Browser',cv?'Chrome '+cv:ua.slice(0,60),cv&&+cv>=121?'ok':'warn');
  row('Phone (as reported)',(ua.match(/Android[^;)]*;\s*([^;)]+)/)||[])[1]||'not reported');
  const mem=navigator.deviceMemory;row('Memory (RAM)',mem?(mem>=8?'8 GB or more':mem+' GB'):'not reported',mem>=8?'ok':mem>=4?'warn':'bad');if(mem>=8)score++;
  row('Processor cores',navigator.hardwareConcurrency||'?');
  try{const e=await navigator.storage.estimate();const free=(e.quota-e.usage)/1e9;row('Free space for the app',free.toFixed(1)+' GB',free>=4?'ok':free>=2?'warn':'bad');if(free<2)fatal=fatal||'Not enough free storage (need about 2–3 GB).';}catch(_){row('Free space for the app','unknown','warn');}
  if(!navigator.gpu){row('WebGPU (graphics chip access)','not available','bad');fatal='This Chrome cannot use the phone\'s graphics chip (WebGPU). Update Chrome and try again; if it still fails, this phone cannot run the model in the app.';}
  else{let ad=null;try{ad=await navigator.gpu.requestAdapter({powerPreference:'high-performance'});}catch(_){}
    if(!ad){row('WebGPU (graphics chip access)','blocked on this phone','bad');fatal='Chrome has WebGPU but switched it off for this phone\'s graphics chip, so the model cannot run here.';}
    else{row('WebGPU (graphics chip access)','available','ok');score++;
      let info=ad.info;try{if(!info&&ad.requestAdapterInfo)info=await ad.requestAdapterInfo();}catch(_){}
      if(info)row('Graphics chip',[info.vendor,info.architecture,info.device,info.description].filter(Boolean).join(' ')||'not reported');
      const f16=ad.features.has('shader-f16');row('Half-precision maths (faster)',f16?'yes':'no',f16?'ok':'warn');if(f16)score++;
      const L=ad.limits,mb=L.maxStorageBufferBindingSize/2**20,bs=L.maxBufferSize/2**20;
      row('Largest GPU block',Math.round(Math.min(mb,bs))+' MB',Math.min(mb,bs)>=1000?'ok':Math.min(mb,bs)>=128?'warn':'bad');if(Math.min(mb,bs)>=1000)score++;if(Math.min(mb,bs)<128)fatal=fatal||'The graphics chip limits are too small for the model.';
      try{const dev=await ad.requestDevice({requiredLimits:{maxStorageBufferBindingSize:L.maxStorageBufferBindingSize,maxBufferSize:L.maxBufferSize}});V.textContent='Measuring speed…';
        const g=await bench(dev);row('Graphics speed (test)',g.toFixed(0)+' GFLOPS',g>=60?'ok':g>=20?'warn':'bad');if(g>=60)score++;dev.destroy();}
      catch(e){row('Graphics speed (test)','failed: '+e.message,'bad');}}}
  let v;if(fatal)v='❌ Not suitable. '+fatal;
  else if(score>=4)v='✅ Good. This phone should run a small conversation model at a usable speed (about 1–3 s per reply).';
  else if(score>=2)v='🟡 Possible. A very small model should run, but replies may be slow (several seconds).';
  else v='🟠 Weak. The model may run but likely too slowly to be pleasant.';
  V.textContent=v;R.unshift('Verdict: '+v);document.getElementById('copy').hidden=false;};
document.getElementById('copy').onclick=async()=>{const t=R.join('\n');try{await navigator.clipboard.writeText(t);document.getElementById('copy').textContent='Copied. Paste it in the chat.';}catch(_){prompt('Copy this:',t);}};
</script></body></html>
