<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}</style></head><body><title>Night Sky VR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Chivo+Mono:wght@400&display=swap">
<style>
/* Layout: full-bleed sky dome; controls in dim "red flashlight" tones (red light keeps night vision) along the bottom, readout at top. Single dark look by choice. */
:root{
  --void:#020308; --panel:rgba(14,6,8,.74); --line:rgba(255,110,95,.22);
  --ink:#f0c8c0; --dim:#a8776f; --red:#ff6a5c;
  --f-body:"Barlow Semi Condensed",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"Chivo Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--void);color:var(--ink);font-family:var(--f-body)}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;left:0;right:0;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.bottom{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
.title{font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:13px;color:var(--red)}
.read{font-family:var(--f-mono);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;text-align:right;line-height:1.5}
.read b{color:var(--ink);font-weight:400}
.strip{pointer-events:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--panel);backdrop-filter:blur(6px);
  border:1px solid var(--line);border-radius:12px;padding:8px;max-width:780px;margin:0 auto}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:1 1 100%}
button,.filebtn{font:500 13px var(--f-body);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;
  padding:7px 10px;cursor:pointer;white-space:nowrap;letter-spacing:.02em;position:relative}
button:hover,.filebtn:hover{border-color:var(--dim)}
button:focus-visible,.filebtn:focus-within{outline:2px solid var(--red);outline-offset:2px}
button[aria-pressed="true"]{background:rgba(255,106,92,.16);border-color:var(--red)}
.vr{border-color:var(--red);color:var(--red);font-weight:600;text-transform:uppercase;letter-spacing:.1em}
label.time{font-family:var(--f-mono);font-size:11px;color:var(--dim);display:flex;gap:8px;align-items:center;flex:1 1 220px}
input[type=range]{accent-color:var(--red);flex:1;min-width:100px}
.filebtn input{position:absolute;opacity:0;width:1px;height:1px}
.say{font-family:var(--f-mono);font-size:11px;color:var(--dim);flex:1 1 100%}
.say b{color:var(--ink);font-weight:400}
#micDot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--dim);margin-right:6px;vertical-align:1px}
#voiceCmdBtn[aria-pressed="true"] #micDot{background:var(--red);box-shadow:0 0 6px var(--red)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 170px);background:var(--panel);
  border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;max-width:min(90vw,440px);text-align:center;z-index:6}
#caption{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 64px);max-width:min(88vw,560px);text-align:center;font-size:14px;line-height:1.4;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;pointer-events:none;z-index:3}
#exitVR{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);z-index:5;opacity:.6}
body.stereo .hud,body.stereo #caption{display:none}
body.stereo #divider{display:block}
#divider{display:none;position:fixed;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:#000;z-index:4;pointer-events:none}
</style>

<canvas id="gl"></canvas>
<div id="divider"></div>

<div class="hud top">
  <div class="title">Night Sky · Bhubaneswar 20.3° N</div>
  <div class="read" id="readout"></div>
</div>

<div class="hud bottom">
  <div class="strip">
    <div class="row">
      <label class="time" for="tSlider">Time <input id="tSlider" type="range" min="-720" max="720" step="10" value="0"><span id="tOut">+0 h</span></label>
      <button id="nowBtn">Tonight 9 PM</button>
    </div>
    <div class="row">
      <button id="voiceCmdBtn" aria-pressed="false"><span id="micDot"></span>Voice commands</button>
      <button id="voiceBtn" aria-pressed="true">Narration</button>
      <button id="motionBtn" aria-pressed="false">Look around</button>
      <button id="alignBtn">Face north + align</button>
      <button id="zinBtn" aria-label="Zoom in">Zoom +</button>
      <button id="zoutBtn" aria-label="Zoom out">Zoom −</button>
      <button id="linesBtn" aria-pressed="true">Lines</button>
      <button id="namesBtn" aria-pressed="true">Names</button>
      <button id="groundBtn" aria-pressed="true">Ground</button>
      <span class="filebtn"><input id="photoIn" type="file" accept="image/*">360° photo</span>
      <button id="skyBtn" hidden>Back to sky</button>
      <button id="fsBtn">Full screen</button>
      <button id="vrBtn" class="vr">Headset view</button>
    </div>
    <div class="say">Say <b>zoom in</b> · <b>zoom out</b> · <b>reset</b> · <b>tell me more</b> · <b>stop</b></div>
  </div>
</div>
<button id="exitVR" hidden>Exit headset view</button>
<div id="toast" hidden></div>
<div id="caption" aria-live="polite" hidden></div>

<script>
(function(){
const LAT=20.30, LON=85.82, R=100, D2R=Math.PI/180, SD=window.SKYDATA;

function eq(raH,dec,r){const a=raH*15*D2R,d=dec*D2R;return new THREE.Vector3(r*Math.cos(d)*Math.cos(a),r*Math.cos(d)*Math.sin(a),r*Math.sin(d));}
function rnd(seed){return()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646}}
const rand=rnd(7);
// galactic <-> equatorial (J2000)
const GM=[[-0.0548755604,-0.8734370902,-0.4838350155],[0.4941094279,-0.4448296300,0.7469822445],[-0.8676661490,-0.1980763734,0.4559837762]];
function bvRGB(bv){bv=Math.max(-0.4,Math.min(2,bv));const T=4600*(1/(0.92*bv+1.7)+1/(0.92*bv+0.62));const t=T/100;let r,g,b;
  if(t<=66){r=255;g=99.47*Math.log(t)-161.12;b=t<=19?0:138.52*Math.log(t-10)-305.04;}else{r=329.7*Math.pow(t-60,-0.1332);g=288.12*Math.pow(t-60,-0.0755);b=255;}
  const c=x=>Math.max(0,Math.min(255,x))/255;return new THREE.Color(c(r),c(g),c(b)).lerp(new THREE.Color(1,1,1),0.35);}

// ---------- decode catalogue ----------
const raw=atob(SD.stars),NS=raw.length/6,bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
const dv=new DataView(bytes.buffer);
const sRA=new Float32Array(NS),sDE=new Float32Array(NS),sMag=new Float32Array(NS),sV=new Float32Array(NS*3);
const pos=new Float32Array(NS*3),col=new Float32Array(NS*3),tw=new Float32Array(NS);
for(let i=0;i<NS;i++){const o=i*6;const ra=dv.getUint16(o,true)/65535*24,de=dv.getInt16(o+2,true)/32767*90,m=dv.getInt8(o+4)/25+3,ci=dv.getInt8(o+5)/60;
  sRA[i]=ra;sDE[i]=de;sMag[i]=m;const v=eq(ra,de,1);sV.set([v.x,v.y,v.z],i*3);pos.set([v.x*R,v.y*R,v.z*R],i*3);
  const c=bvRGB(ci);col.set([c.r,c.g,c.b],i*3);tw[i]=rand();}
const INFO=SD.info,CONS=SD.cons;

// ---------- renderer ----------
const canvas=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
const PR=Math.min(devicePixelRatio,2);renderer.setPixelRatio(PR);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(70,1,0.1,1000);scene.add(camera);
const sky=new THREE.Group();sky.matrixAutoUpdate=false;scene.add(sky);

const starMat=new THREE.ShaderMaterial({
  uniforms:{uPx:{value:PR},uGround:{value:1},uT:{value:0},uTw:{value:1},uLim:{value:6}},
  vertexShader:`attribute float mag;attribute vec3 color;attribute float tw;uniform float uPx,uGround,uT,uTw,uLim;varying vec3 vC;varying float vA;
  void main(){vec4 wp=modelMatrix*vec4(position,1.);float alt=wp.y/length(wp.xyz);
   float ext=mix(1.,smoothstep(-0.005,0.14,alt)*0.85+0.15*step(0.,alt),uGround);ext*=mix(1.,step(0.,alt),uGround);
   float s=max(0.,uLim+0.5-mag);float fade=smoothstep(uLim+0.5,uLim-0.3,mag);
   float t=1.+uTw*tw*0.16*sin(uT*(3.+tw*5.)+tw*40.)*(1.2-clamp(alt,0.,1.));
   vC=color*clamp(0.16+0.2*s,0.16,1.7)*t;vA=ext*fade;
   gl_PointSize=min(14.,1.3+1.25*s+0.9*max(0.,1.-mag))*uPx;gl_Position=projectionMatrix*viewMatrix*wp;}`,
  fragmentShader:`varying vec3 vC;varying float vA;void main(){float d=length(gl_PointCoord-.5);float a=smoothstep(.5,0.,d);a=a*a+0.9*smoothstep(.2,0.,d);gl_FragColor=vec4(vC*a*vA,1.);}`,
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
{const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));
 g.setAttribute('mag',new THREE.BufferAttribute(sMag,1));g.setAttribute('tw',new THREE.BufferAttribute(tw,1));sky.add(new THREE.Points(g,starMat));}

// Milky Way from survey outline
const mwMat=new THREE.ShaderMaterial({uniforms:{map:{value:null},uGround:{value:1},uK:{value:1}},side:THREE.BackSide,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  vertexShader:`varying vec3 vE;varying float vAlt;void main(){vE=position;vec4 wp=modelMatrix*vec4(position,1.);vAlt=normalize(wp.xyz).y;gl_Position=projectionMatrix*viewMatrix*wp;}`,
  fragmentShader:`uniform sampler2D map;uniform float uGround,uK;varying vec3 vE;varying float vAlt;
  void main(){vec3 d=normalize(vE);float lon=atan(d.y,d.x);float lat=asin(clamp(d.z,-1.,1.));vec2 uv=vec2(lon/6.2831853+0.5,lat/3.1415927+0.5);
   float c=texture2D(map,uv).r;float f=mix(1.,smoothstep(0.,0.18,vAlt),uGround);gl_FragColor=vec4(vec3(.55,.6,.76)*c*0.33*f*uK,1.);}`});
new THREE.TextureLoader().load(SD.mw,t=>{t.generateMipmaps=false;t.minFilter=THREE.LinearFilter;t.wrapS=THREE.RepeatWrapping;mwMat.uniforms.map.value=t;});
const mwSphere=new THREE.Mesh(new THREE.SphereGeometry(R*1.05,96,48),mwMat);mwSphere.visible=true;sky.add(mwSphere);

// ---------- labels ----------
const labels=[];
function label(text,h,color,italic){const cv=document.createElement('canvas'),g=cv.getContext('2d'),fs=64;
  const font=`${italic?'italic ':''}500 ${fs}px "Barlow Semi Condensed", sans-serif`;g.font=font;const w=Math.ceil(g.measureText(text).width)+24;
  cv.width=w;cv.height=fs*1.4;g.font=font;g.fillStyle=color;g.textBaseline='middle';g.fillText(text,12,cv.height/2);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),transparent:true,depthWrite:false,depthTest:false,opacity:.85}));
  sp.userData.base=[h*w/cv.height,h];sp.scale.set(h*w/cv.height,h,1);labels.push(sp);return sp;}
function dropLabel(sp){const i=labels.indexOf(sp);if(i>=0)labels.splice(i,1);sp.material.map.dispose();sp.material.dispose();}

// constellation lines + names (88 IAU)
const lineGroup=new THREE.Group(),consNames=new THREE.Group(),starNames=new THREE.Group(),zoomNames=new THREE.Group(),dsoGroup=new THREE.Group();
[lineGroup,consNames,starNames,zoomNames,dsoGroup].forEach(g=>sky.add(g));
const consCen={};
{const segs=[];for(const k in SD.lines){const c=new THREE.Vector3();let n=0;
  SD.lines[k].forEach(seg=>{for(let i=0;i<seg.length;i++){const v=eq(seg[i][0]/15,seg[i][1],R*.995);c.add(v);n++;
    if(i>0){const u=eq(seg[i-1][0]/15,seg[i-1][1],R*.995);segs.push(u.x,u.y,u.z,v.x,v.y,v.z);}}});
  consCen[k]=c.divideScalar(n).normalize();}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(segs,3));
 lineGroup.add(new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:0x6d8cc7,transparent:true,opacity:.34,depthWrite:false})));}
// star name lookups

const fwd=new THREE.Vector3(),eqv=new THREE.Vector3();

  let count=0;const cc={},br=[];
  for(let i=0;i<NS;i++){const d=c.x*sV[i*3]+c.y*sV[i*3+1]+c.z*sV[i*3+2];if(d<cr)continue;if(sMag[i]<=lim)count++;
    if(i<INFO.length){cc[INFO[i][3]]=(cc[INFO[i][3]]||0)+1;if(br.length<3)br.push(i);}}
  let con=null,cm=0;for(const k in cc)if(cc[k]>cm){cm=cc[k];con=k;}
  const ds=DSO.filter(o=>Math.acos(Math.min(1,c.dot(o.v)))<rad+o.dim/120*D2R).sort((a,b)=>Math.acos(Math.min(1,c.dot(a.v)))-Math.acos(Math.min(1,c.dot(b.v)))).slice(0,2);

addEventListener('pointerdown',unlock,{capture:true});
vBtn.onclick=()=>{voiceOn=!voiceOn;vBtn.setAttribute('aria-pressed',voiceOn);if(!voiceOn){synth&&synth.cancel();cap.hidden=true;setCapSprite(null);}else{lastSaid=null;}};
function speak(t){if(!voiceOn||!synth)return;synth.cancel();const u=new SpeechSynthesisUtterance(t);if(voice)u.voice=voice;u.lang=voice?voice.lang:'en-IN';u.rate=0.95;
  u.onend=()=>{speakingUntil=performance.now()+700;};synth.speak(u);}
function show(text,name){if(!voiceOn)return;cap.textContent=text;cap.hidden=false;setCapSprite(name);}
let capSprite=null;
function setCapSprite(text){if(capSprite){camera.remove(capSprite);dropLabel(capSprite);capSprite=null;}if(!text)return;
  capSprite=label(text,0.09,"#ffd9cf");capSprite.material.depthTest=false;capSprite.renderOrder=10;capSprite.center.set(0.5,1.6);capSprite.position.set(0,0,-1);camera.add(capSprite);}
const ret=new THREE.Mesh(new THREE.RingGeometry(0.008,0.011,32),new THREE.MeshBasicMaterial({color:0xff6a5c,transparent:true,opacity:.7,depthTest:false}));
ret.position.set(0,0,-1);ret.renderOrder=10;camera.add(ret);
let cand=null,candT=0,lastSaid=null,pendingReport=false,lastRep=new THREE.Vector3(),repT=0;const tv=new THREE.Vector3();
function wideTarget(){camera.getWorldDirection(fwd);if(photo.visible)return null;const groundOn=groundGroup.visible;if(groundOn&&fwd.y<-0.03)return null;
  let best=null,bs=1;for(const t of targets){tv.copy(t.v).applyMatrix4(sky.matrix).normalize();if(groundOn&&tv.y<0)continue;
    const ang=Math.acos(Math.min(1,fwd.dot(tv)))/D2R,sc=ang/t.thr/t.w;if(ang<t.thr&&sc<bs){bs=sc;best=t;}}
  if(best)return best;const e=centreEq();const g=[0,1,2].map(i=>GM[i][0]*e.x+GM[i][1]*e.y+GM[i][2]*e.z);
  const b=Math.asin(g[2])/D2R,l=Math.atan2(g[1],g[0])/D2R;
  if(Math.abs(b)<9&&Math.abs(l)<20)return{k:'__MWC',text:()=>MWC,name:'Galactic centre'};if(Math.abs(b)<9)return{k:'__MW',text:()=>MW,name:'Milky Way'};return null;}
function narrate(dt){
  const zoomed=fovGoal<FOV0-1, settled=Math.abs(camera.fov-fovGoal)<0.05*fovGoal;
  if(zoomed){if(!settled)return;const c=centreEq();
    const moved=Math.acos(Math.min(1,c.dot(lastRep)))/D2R>camera.fov*0.3;
    if(moved){repT+=dt;}else repT=0;
    if(pendingReport||(moved&&repT>2)){pendingReport=false;repT=0;lastRep.copy(c);const r=fieldReport();speak(r.t);show(r.t,r.name);lastSaid='__zoom';}
    return;}
  const t=wideTarget(),k=t?t.k:null;
  if(k!==cand){cand=k;candT=0;}else candT+=dt;
  if(cand&&candT>0.9&&cand!==lastSaid){lastSaid=cand;const text=t.text();speak(text);show(text,t.name||(CONS[cand]?CONS[cand][0]:cand));}
  if(!cand&&candT>1.5&&lastSaid){lastSaid=null;cap.hidden=true;setCapSprite(null);}}
function tellMore(){if(fovGoal<FOV0-1){const r=fieldReport();speak(r.t);show(r.t,r.name);return;}
  const t=wideTarget();if(t){const text=t.text();speak(text);show(text,t.name||(CONS[t.k]?CONS[t.k][0]:t.k));}
  else{const r=fieldReport();speak(r.t);show(r.t,r.name);}}

// ---------- voice commands ----------
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const vcBtn=document.getElementById('voiceCmdBtn');let rec=null,listening=false;
function heard(text){const t=text.toLowerCase().trim();const busy=(synth&&synth.speaking)||performance.now()<speakingUntil;
  if(/\b(stop|quiet|silence|shut up)\b/.test(t)){synth&&synth.cancel();flash('Stopped');return;}
  if(/\bzoom(ing)? in\b|\bcloser\b|\bmagnify\b|\benlarge\b/.test(t)){synth&&synth.cancel();zoomIn();flash('Zoom in');return;}
  if(/\bzoom(ing)? out\b|\bwider\b|\bfurther\b/.test(t)){synth&&synth.cancel();zoomOut();flash('Zoom out');return;}
  if(/\breset\b|\bnormal( view)?\b|\bgo back\b|\bhome\b|\bfull view\b/.test(t)){synth&&synth.cancel();zoomReset();flash('Normal view');return;}
  if(busy)return;
  if(/\btell me more\b|\bmore\b|\bdetails?\b|\bdescribe\b|\bwhat is (this|that)\b|\bwhat am i looking at\b/.test(t)){tellMore();return;}}
function flash(t){say('Heard: '+t,1600);if(stereo){setCapSprite(t);}}
function startRec(){if(!SR){say('Voice commands need Chrome on Android, or Safari on iPhone with Siri turned on.',7000);return;}
  rec=new SR();rec.lang='en-IN';rec.continuous=true;rec.interimResults=false;rec.maxAlternatives=3;
  rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal){const alts=[...e.results[i]].map(a=>a.transcript).join(' | ');heard(alts);}};
  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){listening=false;vcBtn.setAttribute('aria-pressed','false');say('Microphone access was refused, so voice commands are off. Allow the microphone for this site and try again.',7000);}};
  rec.onend=()=>{if(listening){try{rec.start();}catch(e){setTimeout(()=>{try{listening&&rec.start();}catch(_){}},400);}}};
  try{rec.start();listening=true;vcBtn.setAttribute('aria-pressed','true');say('Listening. Say "zoom in", "zoom out", "reset", "tell me more" or "stop".',4000);}catch(e){say('Voice commands could not start here.');}}
vcBtn.onclick=()=>{if(listening){listening=false;try{rec.stop();}catch(e){}vcBtn.setAttribute('aria-pressed','false');}else startRec();};

// ---------- zoom-dependent labels ----------
let zoomLabelAt=null;
function refreshZoomNames(){zoomNames.children.slice().forEach(s=>{zoomNames.remove(s);dropLabel(s);});
  if(fovGoal>=FOV0-1)return;const c=centreEq(),cr=Math.cos(camera.fov*0.6*D2R);let n=0;
  for(let i=0;i<INFO.length&&n<14;i++){const d=c.x*sV[i*3]+c.y*sV[i*3+1]+c.z*sV[i*3+2];if(d<cr)continue;const f=INFO[i];
    const txt=f[0]||(f[1]?f[1]+' '+f[3]:(f[2]?f[2]+' '+f[3]:''));if(!txt)continue;if(f[0]&&sMag[i]<1.6&&!zoomNames.visible)continue;addStarLabel(i,zoomNames,txt);n++;}
  zoomLabelAt=c.clone();}

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=stereo?(w/2)/h:w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

// ---------- loop ----------
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;starMat.uniforms.uTw.value=reduce?0:1;
const qYaw=new THREE.Quaternion(),Y=new THREE.Vector3(0,1,0),clock=new THREE.Clock(),qT=new THREE.Quaternion();let lastFov=0;
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),0.1);starMat.uniforms.uT.value=clock.elapsedTime;
  // zoom animation
  if(Math.abs(camera.fov-fovGoal)>0.01){camera.fov+=(fovGoal-camera.fov)*Math.min(1,dt*4);camera.updateProjectionMatrix();}
  const f=camera.fov;starMat.uniforms.uLim.value=6+2*Math.max(0,Math.min(1,(FOV0-f)/(FOV0-10)));
  mwMat.uniforms.uK.value=Math.max(0.35,Math.min(1,f/40));
  const k=Math.tan(f/2*D2R)/Math.tan(35*D2R);ret.scale.setScalar(k);for(const s of labels){if(s===capSprite)continue;s.scale.set(s.userData.base[0]*k,s.userData.base[1]*k,1);}
  const zoomed=fovGoal<FOV0-1;
  consNames.visible=namesOn&&f>30;starNames.visible=namesOn;zoomNames.visible=namesOn&&zoomed;dsoGroup.visible=f<45;
  dsoGroup.children.forEach(o=>{if(o.isSprite)o.visible=namesOn;});
  if(Math.abs(f-lastFov)>0.5||!zoomed&&zoomNames.children.length){lastFov=f;updateReadout();}
  // orientation
  if(motionOn&&devQ){qYaw.setFromAxisAngle(Y,yawOff);qT.copy(qYaw).multiply(devQ);const s=f<30?Math.min(1,0.08+f/60):1;camera.quaternion.slerp(qT,s);}
  else camera.quaternion.setFromEuler(new THREE.Euler(pitch,-az,0,'YXZ'));
  if(zoomed&&Math.abs(f-fovGoal)<0.05*fovGoal){const c=centreEq();if(!zoomLabelAt||Math.acos(Math.min(1,c.dot(zoomLabelAt)))/D2R>f*0.25)refreshZoomNames();}
  else if(!zoomed&&zoomNames.children.length){refreshZoomNames();zoomLabelAt=null;}
  narrate(dt);if(capSprite)capSprite.visible=stereo;
  const w=innerWidth,h=innerHeight;
  if(stereo){renderer.setScissorTest(true);
    renderer.setScissor(0,0,w/2,h);renderer.setViewport(0,0,w/2,h);renderer.render(scene,camera);
    renderer.setScissor(w/2,0,w/2,h);renderer.setViewport(w/2,0,w/2,h);renderer.render(scene,camera);renderer.setScissorTest(false);}
  else{renderer.setViewport(0,0,w,h);renderer.render(scene,camera);}
});
window.__sky={zoomIn,zoomOut,zoomReset,fieldReport,tellMore,aim:(raH,dec)=>{const w=eq(raH,dec,1).applyMatrix4(sky.matrix).normalize();az=Math.atan2(w.x,-w.z);pitch=Math.asin(w.y);}};
})();
</script>
